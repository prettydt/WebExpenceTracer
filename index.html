<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>记账应用 - WebExpenseTracer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- iOS-style Navigation Header -->
  <div class="nav-header">
    <h1>💰 记账应用</h1>
  </div>

  <div class="container">

    <!-- Summary Cards -->
    <div class="summary">
      <div class="card balance">
        <span class="label">当前余额</span>
        <span class="amount" id="balance">¥0.00</span>
      </div>
      <div class="card income">
        <span class="label">总收入</span>
        <span class="amount" id="total-income">¥0.00</span>
      </div>
      <div class="card expense">
        <span class="label">总支出</span>
        <span class="amount" id="total-expense">¥0.00</span>
      </div>
    </div>

    <!-- Add Transaction Form -->
    <div class="form-section">
      <h2>添加记录</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="description">描述</label>
          <input
            type="text"
            id="description"
            placeholder="例：工资、餐饮、交通…"
            required
          />
        </div>
        <div class="form-group">
          <label for="amount">金额 (¥)</label>
          <input
            type="number"
            id="amount"
            placeholder="正数为收入，负数为支出"
            step="0.01"
            required
          />
        </div>
        <div class="form-group">
          <label for="category">类别</label>
          <select id="category">
            <option value="收入">💵 收入</option>
            <option value="餐饮">🍜 餐饮</option>
            <option value="交通">🚌 交通</option>
            <option value="购物">🛍️ 购物</option>
            <option value="住房">🏠 住房</option>
            <option value="娱乐">🎮 娱乐</option>
            <option value="医疗">🏥 医疗</option>
            <option value="教育">📚 教育</option>
            <option value="其他">📦 其他</option>
          </select>
        </div>
        <button type="submit" class="btn-add">添加记录</button>
      </form>
    </div>

    <!-- Analytics -->
    <div class="analytics-grid">
      <div class="panel chart-panel">
        <div class="panel-header">
          <h2>图表统计</h2>
          <span class="panel-subtitle">按类别支出分布</span>
        </div>
        <div class="chart-wrapper">
          <canvas id="category-chart" aria-label="按类别支出图表"></canvas>
          <p id="chart-empty" class="empty-msg small">暂无支出数据，添加支出后查看图表。</p>
        </div>
        <div id="chart-legend" class="chart-legend"></div>
      </div>

      <div class="panel budget-panel">
        <div class="panel-header">
          <h2>分类预算</h2>
          <button id="save-budgets" class="btn-secondary" type="button">保存预算</button>
        </div>
        <p class="panel-desc">为各类别设置预算，支出超额时会高亮提示（仅统计负数金额）。</p>
        <div id="budget-list" class="budget-list"></div>
      </div>
    </div>

    <!-- Transaction History -->
    <div class="history-section">
      <div class="history-header">
        <h2>交易记录</h2>
        <button id="clear-all" class="btn-clear" title="清空所有记录">清空</button>
      </div>
      <ul id="transaction-list">
        <!-- Transactions rendered here -->
      </ul>
      <p id="empty-msg" class="empty-msg">暂无记录，快去添加第一笔吧！</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
